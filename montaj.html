<title>Montaj Yordamchisi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: studio shell. Thin project rail on the left (collapses to a select on phones),
     work area on the right with the video pipeline as tabs. Amber is the timeline marker color. */
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #ece9e1;
    --fg: #1d1c1a;
    --fg-muted: #6b6760;
    --line: #d9d5cb;
    --accent: #b45309;
    --accent-fg: #ffffff;
    --accent-soft: #fbe8d3;
    --good: #2f7d4a;
    --warn: #a16207;
    --bad: #b42318;
    --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141516; --surface: #1d1f21; --surface-2: #26292c; --fg: #ebe8e1; --fg-muted: #a09c93;
      --line: #35393d; --accent: #f59e0b; --accent-fg: #1a1203; --accent-soft: #3a2a0c;
      --good: #5fcf7a; --warn: #e2b04a; --bad: #ff7b7b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141516; --surface: #1d1f21; --surface-2: #26292c; --fg: #ebe8e1; --fg-muted: #a09c93;
    --line: #35393d; --accent: #f59e0b; --accent-fg: #1a1203; --accent-soft: #3a2a0c;
    --good: #5fcf7a; --warn: #e2b04a; --bad: #ff7b7b; color-scheme: dark;
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; }
  * { box-sizing: border-box; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
  h2 { font-size: 20px; font-weight: 700; }
  h3 { font-size: 15px; font-weight: 600; }
  .mono { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }

  .shell { height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; }
  .top .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 700; font-size: 13px; flex: 0 0 auto; }
  .top h1 { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .top .status { margin-left: auto; font-size: 12.5px; color: var(--fg-muted); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .top .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .top .status.on .dot { background: var(--good); } .top .status.off .dot { background: var(--bad); }
  .top select { display: none; }

  .body { flex: 1; min-height: 0; display: flex; }
  .rail { width: 240px; flex: 0 0 auto; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 8px; }
  .rail .label { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); font-weight: 600; padding: 0 6px; }
  .pitem { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; text-align: left; background: transparent; width: 100%; }
  .pitem:hover { background: var(--surface-2); }
  .pitem[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .pitem .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .pitem .c { font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .main { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 20px 40px; }
  .main > .inner { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  @media (max-width: 760px) {
    .rail { display: none; }
    .top select { display: block; max-width: 45%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
    .top h1 { display: none; }
    .main { padding: 16px 16px 32px; }
  }

  .btn { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn.sm { padding: 5px 10px; font-size: 13.5px; border-radius: 7px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .crumbs { display: flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--fg-muted); flex-wrap: wrap; }
  .crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .muted { color: var(--fg-muted); font-size: 14px; }
  .empty { border: 1px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--fg-muted); }
  .empty b { color: var(--fg); }
  .msg { font-size: 13.5px; } .msg.ok { color: var(--good); } .msg.bad { color: var(--bad); }

  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .form .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .form { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-muted); }
  .field .hint { font-size: 12.5px; color: var(--fg-muted); }
  .field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
  .field textarea { min-height: 80px; resize: vertical; }
  .field textarea.mono { min-height: 180px; }

  .vlist { display: flex; flex-direction: column; gap: 8px; }
  .vitem { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; cursor: pointer; text-align: left; width: 100%; }
  .vitem:hover { border-color: var(--accent); }
  .vitem .t { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--fg-muted); white-space: nowrap; }
  .pill.ok { background: var(--accent-soft); color: var(--fg); }
  .pill.good { color: var(--good); border: 1px solid var(--good); background: transparent; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { padding: 9px 14px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--fg-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .tab .n { margin-left: 4px; font-size: 11.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }

  .seglist { max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .seg { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .seg:last-child { border-bottom: 0; }
  .seg .tc { color: var(--accent); }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--fg-muted); }
  .stats b { color: var(--fg); font-variant-numeric: tabular-nums; }

  .reels { display: flex; flex-direction: column; gap: 12px; }
  .reel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .reel .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface-2); flex-wrap: wrap; }
  .reel .head .num { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: 0 0 auto; }
  .reel .head input.title { flex: 1; min-width: 140px; border: 0; background: transparent; font-weight: 700; font-family: var(--font-display); font-size: 15px; padding: 2px 4px; }
  .reel .tc { display: inline-flex; gap: 4px; align-items: center; }
  .reel .tc input { width: 72px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--bg); text-align: center; }
  .reel .dur { color: var(--fg-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .reel .body { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  @media (max-width: 640px) { .reel .body { grid-template-columns: 1fr; } }
  .reel .body .full { grid-column: 1 / -1; }
  .reel textarea { min-height: 64px; }
  .reel .reason { font-size: 13px; color: var(--fg-muted); font-style: italic; }
  .reel .foot { display: flex; gap: 8px; padding: 8px 14px 12px; flex-wrap: wrap; }
  .progress { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .progress .bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .progress .bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 999px; }
  @media (prefers-reduced-motion: no-preference) { .progress .bar i { animation: slide 1.4s ease-in-out infinite alternate; } @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } } }
  .soon { padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; color: var(--fg-muted); }
</style>

<div class="shell">
  <header class="top">
    <div class="mark" aria-hidden="true">MY</div>
    <h1>Montaj Yordamchisi</h1>
    <select id="projSelect" aria-label="Loyiha"></select>
    <button class="btn sm" id="newProjBtnTop" type="button">+ Loyiha</button>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Ulanmoqda</span></div>
  </header>
  <div class="body">
    <aside class="rail">
      <div class="label">Loyihalar</div>
      <div id="projList"></div>
      <button class="btn sm" id="newProjBtn" type="button">+ Yangi loyiha</button>
    </aside>
    <main class="main"><div class="inner" id="main"></div></main>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const now = () => new Date().toISOString();
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  const S = {
    db: null, user: null, sample: null, canWrite: null,
    projects: [], videos: [], pid: null, vid: null, tab: "transkript",
    unsubProjects: null, unsubVideos: null, unsubVideo: null, video: null,
    busy: false, ctl: null, local: {},
  };
  const PROJECT_FIELDS = ["name", "desc", "audience", "lang", "tone", "scriptRules", "visualStyle", "animStyle", "reelsCount", "reelsMin", "reelsMax", "model"];
  const PROJECT_DEFAULTS = { name: "", desc: "", audience: "", lang: "o'zbek", tone: "", scriptRules: "", visualStyle: "", animStyle: "", reelsCount: 5, reelsMin: 30, reelsMax: 60, model: "default" };

  // ---------- Time helpers ----------
  function parseTc(s) {
    if (typeof s === "number") return s;
    const m = String(s).trim().match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2})(?:[.,](\d{1,3}))?$/);
    if (!m) return null;
    const h = m[1] ? +m[1] : 0, ms = m[4] ? +(m[4].padEnd(3, "0")) : 0;
    return h * 3600 + (+m[2]) * 60 + (+m[3]) + ms / 1000;
  }
  function fmtTc(sec, withMs) {
    if (sec == null || isNaN(sec)) return "--:--";
    const t = Math.max(0, sec); const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = Math.floor(t % 60);
    const base = (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(s).padStart(2, "0");
    return withMs ? base + "." + String(Math.round((t - Math.floor(t)) * 1000)).padStart(3, "0") : base;
  }
  function fmtDur(sec) { if (sec == null) return ""; const m = Math.floor(sec / 60), s = Math.round(sec % 60); return m ? `${m} daq ${s} s` : `${s} s`; }

  // ---------- Transcript parsing ----------
  function parseTranscript(raw) {
    const text = String(raw).replace(/\r/g, "").trim();
    if (!text) return { segments: [], format: "txt" };
    if (/-->/.test(text)) {
      const segments = [];
      for (const block of text.split(/\n\s*\n/)) {
        const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
        const ti = lines.findIndex((l) => l.includes("-->"));
        if (ti < 0) continue;
        const [a, b] = lines[ti].split("-->").map((x) => x.trim().split(/\s+/)[0]);
        const s = parseTc(a), e = parseTc(b);
        const body = lines.slice(ti + 1).join(" ").replace(/<[^>]+>/g, "").trim();
        if (s == null || !body) continue;
        segments.push({ s, e: e == null ? s : e, t: body });
      }
      return { segments, format: /^WEBVTT/.test(text) ? "vtt" : "srt" };
    }
    const segments = text.split(/\n+/).flatMap((p) => p.split(/(?<=[.!?…])\s+/)).map((t) => t.trim()).filter(Boolean).map((t) => ({ s: null, e: null, t }));
    return { segments, format: "txt" };
  }
  function hasTimes(v) { return Boolean(v && v.segments && v.segments.length && v.segments[0].s != null); }
  function duration(v) { if (!hasTimes(v)) return null; const last = v.segments[v.segments.length - 1]; return last.e ?? last.s; }
  function compactTranscript(segments) {
    return segments.map((g) => (g.s == null ? "" : `[${fmtTc(g.s)}] `) + g.t).join("\n");
  }

  // ---------- Status ----------
  function setStatus(kind, text) { $("status").className = "status " + kind; $("statusText").textContent = text; }

  // ---------- Rendering: projects rail ----------
  function project() { return S.projects.find((p) => p.id === S.pid) || null; }
  function renderRail() {
    const list = $("projList"); list.innerHTML = "";
    const sel = $("projSelect"); sel.innerHTML = "";
    if (!S.projects.length) {
      list.innerHTML = `<div class="muted" style="padding:4px 8px">Hali loyiha yo'q.</div>`;
      sel.innerHTML = `<option value="">Loyiha yo'q</option>`;
    }
    for (const p of S.projects) {
      const b = document.createElement("button"); b.type = "button"; b.className = "pitem"; b.setAttribute("aria-current", String(p.id === S.pid));
      b.innerHTML = `<span class="n"></span><span class="c"></span>`;
      b.querySelector(".n").textContent = p.name || "Nomsiz"; b.querySelector(".c").textContent = p.videoCount ? String(p.videoCount) : "";
      b.addEventListener("click", () => selectProject(p.id)); list.appendChild(b);
      const o = document.createElement("option"); o.value = p.id; o.textContent = p.name || "Nomsiz"; o.selected = p.id === S.pid; sel.appendChild(o);
    }
  }
  $("projSelect").addEventListener("change", (e) => { if (e.target.value) selectProject(e.target.value); });

  // ---------- Navigation ----------
  function remember() { try { localStorage.setItem("montaj.nav", JSON.stringify({ pid: S.pid, vid: S.vid, tab: S.tab })); } catch (_) {} }
  function selectProject(pid) {
    if (S.pid === pid && !S.vid) return;
    S.pid = pid; S.vid = null; S.video = null; S.local = {};
    if (S.unsubVideos) { S.unsubVideos(); S.unsubVideos = null; }
    if (S.unsubVideo) { S.unsubVideo(); S.unsubVideo = null; }
    S.videos = [];
    if (S.db && pid) {
      S.unsubVideos = S.db.collection("projects/" + pid + "/videos").onSnapshot((snap) => {
        S.videos = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        S.videos.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
        if (!S.vid) renderMain();
      }, () => {});
    }
    remember(); renderRail(); renderMain();
  }
  function selectVideo(vid) {
    S.vid = vid; S.local = {}; S.tab = "transkript";
    if (S.unsubVideo) { S.unsubVideo(); S.unsubVideo = null; }
    S.video = S.videos.find((v) => v.id === vid) || null;
    if (S.db && vid) {
      S.unsubVideo = S.db.doc("projects/" + S.pid + "/videos/" + vid).onSnapshot((snap) => {
        if (!snap.exists) { S.video = null; S.vid = null; renderMain(); return; }
        const fresh = Object.assign({ id: snap.id }, snap.data());
        const wasBusy = S.busy; S.video = fresh;
        if (!wasBusy && !S.local.dirtyReels) renderMain();
      }, () => {});
    }
    remember(); renderMain();
  }

  // ---------- Main views ----------
  const main = $("main");
  function renderMain() {
    if (!S.pid || !project()) return renderWelcome();
    if (!S.vid) return renderProject();
    return renderVideo();
  }

  function renderWelcome() {
    main.innerHTML = `
      <div class="card">
        <h2>Montaj jarayoni bitta joyda</h2>
        <p class="muted" style="margin:8px 0 0">Loyiha yarating, uslubini bir marta yozing, keyin har video uchun transkriptni qo'ying.
        Claude loyiha uslubida reels rejasini time-code bilan tuzadi. Keyingi bosqichlar: storyboard va animatsiya brief'i.</p>
        <div class="row" style="margin-top:14px"><button class="btn primary" type="button" id="welcomeNew">Birinchi loyihani yaratish</button></div>
      </div>
      <div class="card">
        <h3>Transkript qayerdan keladi</h3>
        <p class="muted" style="margin:6px 0 0">Transkript dasturingiz (transcriber.py) chiqargan <b>SRT</b> faylni video sahifasiga qo'yasiz. SRT'da time-code bor, shuning uchun reels aniq kesiladi.</p>
      </div>`;
    $("welcomeNew").addEventListener("click", createProject);
  }

  async function createProject() {
    if (!S.db) return alertBox("Baza ulanmagan: bu oynada loyiha yaratib bo'lmaydi.");
    const id = uid();
    try {
      await S.db.doc("projects/" + id).set(Object.assign({}, PROJECT_DEFAULTS, { name: "Yangi loyiha", createdAt: now(), updatedAt: now() }));
      selectProject(id);
    } catch (e) { alertBox(writeError(e)); }
  }
  $("newProjBtn").addEventListener("click", createProject);
  $("newProjBtnTop").addEventListener("click", createProject);
  function writeError(e) { return e && e.code === "invalid_argument" ? "Ruxsat yo'q: o'zgartirish uchun Contributor yoki undan yuqori daraja kerak." : "Saqlab bo'lmadi. Qayta urinib ko'ring."; }
  function alertBox(text) { const d = document.createElement("div"); d.className = "card msg bad"; d.textContent = text; main.prepend(d); setTimeout(() => d.remove(), 5000); }

  function renderProject() {
    const p = project();
    main.innerHTML = `
      <div class="crumbs"><span>Loyiha</span><span>›</span><b style="color:var(--fg)">${esc(p.name || "Nomsiz")}</b></div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><h2>Videolar</h2><button class="btn primary sm" type="button" id="newVideo">+ Yangi video</button></div>
        <div class="vlist" id="vlist" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><h2>Loyiha profili</h2><span class="muted">Har bosqichda Claude'ga beriladi</span></div>
        <form class="form" id="pform" style="margin-top:12px">
          <div class="field"><label for="p_name">Nomi</label><input id="p_name" maxlength="80" required></div>
          <div class="field"><label for="p_lang">Skript tili</label><select id="p_lang"><option>o'zbek</option><option>rus</option><option>ingliz</option><option>o'zbek va rus aralash</option></select></div>
          <div class="field full"><label for="p_desc">Loyiha haqida</label><textarea id="p_desc" placeholder="Nima biznes, nima sotiladi, kanal maqsadi"></textarea></div>
          <div class="field"><label for="p_audience">Auditoriya</label><input id="p_audience" maxlength="200" placeholder="Masalan: 18–30 yosh, Koreyada o'qimoqchi"></div>
          <div class="field"><label for="p_tone">Ohang</label><input id="p_tone" maxlength="200" placeholder="Masalan: ishonchli, do'stona, ortiqcha hayajonsiz"></div>
          <div class="field full"><label for="p_scriptRules">Skript qoidalari</label><textarea id="p_scriptRules" placeholder="Majburiy iboralar, taqiqlangan so'zlar, CTA uslubi, misol skript"></textarea></div>
          <div class="field"><label for="p_visualStyle">Vizual uslub</label><textarea id="p_visualStyle" placeholder="Ranglar, shrift, kadr uslubi (storyboard uchun)"></textarea></div>
          <div class="field"><label for="p_animStyle">Animatsiya uslubi</label><textarea id="p_animStyle" placeholder="Masalan: yassi 2D, sekin o'tishlar, ikonkalar (animatsiya uchun)"></textarea></div>
          <div class="field"><label for="p_reelsCount">Reels soni (standart)</label><input id="p_reelsCount" type="number" min="1" max="20"></div>

  function snapTimes(reels, segs) {

  async function generateReels(v) {
    if (S.busy || !S.sample) return;
    const p = project(); const segs = v.segments || [];
    const n = Math.min(20, Math.max(1, Number($("r_count").value) || 5)); let min = Number($("r_min").value) || 30, max = Number($("r_max").value) || 60; if (min > max) [min, max] = [max, min];
    const note = $("r_note").value.trim();
    S.busy = true; S.ctl = new AbortController(); $("r_gen").disabled = true; $("r_progress").hidden = false; $("r_err").textContent = "";
    const ptext = $("r_ptext"); const tier = p.model === "complex" ? "complex" : "default";
    const onText = ({ text }) => { ptext.textContent = `Claude yozmoqda… ${text.length} belgi`; };
    try {
      let chosen;
      const full = compactTranscript(segs);
      if (full.length <= 120000) {
        ptext.textContent = "Claude transkriptni o'qiyapti va eng kuchli joylarni tanlayapti…";
        chosen = await S.sample.json(reelsPrompt(p, segs, n, min, max, note, false), { cache: false, signal: S.ctl.signal, modelTier: tier, onText });
      } else {
        const chunks = []; let cur = [], len = 0;
        for (const g of segs) { const l = g.t.length + 10; if (len + l > 100000 && cur.length) { chunks.push(cur); cur = []; len = 0; } cur.push(g); len += l; }
        if (cur.length) chunks.push(cur);
        const cands = [];
        for (let i = 0; i < chunks.length; i++) {
          ptext.textContent = `Uzun transkript: ${i + 1}/${chunks.length} bo'lak tahlil qilinmoqda…`;
          const part = await S.sample.json(reelsPrompt(p, chunks[i], Math.max(2, Math.ceil(n / 2)), min, max, note, true), { cache: false, signal: S.ctl.signal, modelTier: tier });
          if (Array.isArray(part)) cands.push(...snapTimes(part, chunks[i]));
        }
        ptext.textContent = "Nomzodlar ichidan eng yaxshilari tanlanmoqda…";
        const candSegs = cands.flatMap((c) => segs.filter((g) => g.s != null && g.s >= c.start - 0.5 && g.s < c.end)).filter((g, i, a) => a.indexOf(g) === i).sort((a, b) => a.s - b.s);
        chosen = await S.sample.json(reelsPrompt(p, candSegs.length ? candSegs : segs.slice(0, 500), n, min, max, note, false), { cache: false, signal: S.ctl.signal, modelTier: tier, onText });
      }
      if (!Array.isArray(chosen)) throw { code: "invalid_json", message: "not array" };
      const reels = snapTimes(chosen, segs).map(cleanReel).slice(0, n);
      S.local = {};
      await videoRef().update({ reels, reelsStatus: "draft", updatedAt: now() });
      S.video = Object.assign({}, v, { reels, reelsStatus: "draft" }); S.tab = "reels";
    } catch (e) {
      const code = e && e.code;
      const ERR = { cancelled: "", not_granted: "Claude'dan foydalanishga ruxsat berilmadi.", rate_limited: "Juda ko'p so'rov. Birozdan keyin qayta urinib ko'ring.", invalid_json: "Claude javobini o'qib bo'lmadi. Qayta urinib ko'ring yoki reels sonini kamaytiring.",
        prompt_too_large: "Transkript juda uzun. Videoni ikkiga bo'lib kiriting.", refused: "Claude bu so'rovni rad etdi.", invalid_argument: "Saqlashga ruxsat yo'q." };
      $("r_err").textContent = code in ERR ? ERR[code] : "Xatolik: " + (e && e.message ? e.message : "noma'lum") + ". Qayta urinib ko'ring.";
    } finally { S.busy = false; S.ctl = null; renderVideo(); }
  }

  // ---------- Boot ----------
  renderRail(); renderMain();
  (async () => {
    const use = (n) => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [user, db, sample] = await Promise.all([use("user"), use("db"), use("sample")]);
    S.user = user; S.db = db; S.sample = sample;
    setStatus(sample ? "on" : "off", sample ? (db ? "Claude va baza tayyor" : "Claude tayyor, baza yo'q") : "Claude ulanmagan");
    if (user) { try { S.canWrite = await user.can("data.write"); } catch (_) {} }
    if (!db) { main.innerHTML = `<div class="empty"><b>Baza ulanmagan.</b><br>Sahifani claude.ai ichida, kirgan holda oching.</div>`; return; }
    let nav = null; try { nav = JSON.parse(localStorage.getItem("montaj.nav") || "null"); } catch (_) {}
    S.unsubProjects = db.collection("projects").onSnapshot((snap) => {
      S.projects = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => String(a.name).localeCompare(String(b.name)));
      if (!S.pid) {
        const want = nav && S.projects.some((p) => p.id === nav.pid) ? nav.pid : (S.projects[0] && S.projects[0].id);
        if (want) { selectProject(want); if (nav && nav.pid === want && nav.vid) { S.vid = nav.vid; S.tab = nav.tab || "transkript"; selectVideo(nav.vid); } nav = null; return; }
      } else if (!S.projects.some((p) => p.id === S.pid)) { S.pid = null; S.vid = null; }
      renderRail();
      if (!S.pid) renderMain();
      else if (!S.vid) { const c = main.querySelector(".crumbs b"); const p = project(); if (c && p) c.textContent = p.name || "Nomsiz"; }
    }, () => {});
  })();
})();
</script>
